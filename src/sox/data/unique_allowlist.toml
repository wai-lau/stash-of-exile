# Build-relevant uniques for sox.
# GENERATED by scripts/resolve_unique_allowlist.py — every name verified
# against the live trade2 item table, enriched from the poe2scout index.
#
# index_price/quantity/spread are a SNAPSHOT for threshold tuning. The tool
# recomputes them from live scout data at runtime; do not treat as current.

[thresholds]
# Escalate a unique to a live trade search when ANY holds:
#   corrupted, not in the index, allocates a notable,
#   grants a skill (the index never records one),
#   index_price >= chase_price_ex,
#   OR any single roll >= roll_score_percentile.
# The last clause is the best roll, not the mean: a unique carrying one
# near-perfect build-defining roll beside poor filler averages out to
# mediocre, and the market does not price it that way.
chase_price_ex = 5000
roll_score_percentile = 0.75
illiquid_quantity = 20

